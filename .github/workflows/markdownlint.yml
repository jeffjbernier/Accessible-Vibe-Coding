name: markdownlint

# Every Markdown file here passes markdownlint's default rules, including
# the 80-column line limit. Nothing stops a long line or a skipped heading
# from creeping back in unless something runs the linter, so this job does.
# The version matches what contributors run locally (see CONTRIBUTING.md).

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - '**/*.md'
      - '.github/workflows/markdownlint.yml'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Lint Markdown
        run: npx --yes markdownlint-cli2@0.23.2 "**/*.md" "#node_modules"
