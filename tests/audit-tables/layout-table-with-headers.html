<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Layout table with headers – audit-tables fixtures</title>
</head>
<body>
  <main>
    <h1>A table marked as layout that still carries data-table markup</h1>

    <table role="presentation">
      <caption>Delivery slots</caption>
      <tr><th scope="col">Monday</th><th scope="col">Tuesday</th></tr>
      <tr><td>Closed</td><td>Open</td></tr>
    </table>
  </main>
</body>
</html>
