<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Valid tables – audit-tables fixtures</title>
</head>
<body>
  <main>
    <h1>Tables the auditor must pass</h1>

    <!-- A section-header row: one colspan header with scope="rowgroup" as
         the first row of its own tbody. Valid, and once flagged as an error. -->
    <table>
      <caption>Availability of holiday accommodation</caption>
      <thead>
        <tr>
          <td></td>
          <th scope="col">Studio</th>
          <th scope="col">Apartment</th>
        </tr>
      </thead>
      <tbody>
        <tr><th colspan="3" scope="rowgroup">Paris</th></tr>
        <tr><th scope="row">1 bedroom</th><td>11</td><td>20</td></tr>
        <tr><th scope="row">2 bedroom</th><td>4</td><td>43</td></tr>
      </tbody>
      <tbody>
        <tr><th colspan="3" scope="rowgroup">Rome</th></tr>
        <tr><th scope="row">1 bedroom</th><td>13</td><td>23</td></tr>
      </tbody>
    </table>

    <!-- Headers named by the control they hold, not by text. -->
    <table>
      <caption>Open orders</caption>
      <thead>
        <tr>
          <th scope="col">
            <input type="checkbox" id="select-all-orders"
                   aria-label="Select all orders">
          </th>
          <th scope="col">Order</th>
          <th scope="col">Status</th>
          <th scope="col">
            <button type="button" aria-label="Column options">
              <svg aria-hidden="true" width="16" height="16"></svg>
            </button>
          </th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>
            <input type="checkbox" id="select-order-1042"
                   aria-label="Select order 1042">
          </td>
          <th scope="row">#1042</th>
          <td>Shipped</td>
          <td></td>
        </tr>
      </tbody>
    </table>

    <!-- A rowspan header that spans every row of its own tbody. -->
    <table>
      <caption>Poster availability</caption>
      <col>
      <col>
      <colgroup span="2"></colgroup>
      <thead>
        <tr>
          <th scope="col">Poster name</th>
          <th scope="col">Color</th>
          <th colspan="2" scope="colgroup">Sizes available</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <th rowspan="2" scope="rowgroup">Zodiac</th>
          <th scope="row">Full color</th>
          <td>A2</td><td>A3</td>
        </tr>
        <tr><th scope="row">Sepia</th><td>A3</td><td>A4</td></tr>
      </tbody>
    </table>
  </main>
</body>
</html>
