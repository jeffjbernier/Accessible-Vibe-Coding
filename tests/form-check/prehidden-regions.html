<!DOCTYPE html>
<!--
  form-check fixture: MUST FAIL §7.4.

  The error summary and the save confirmation ship on first load, each hidden
  with the `hidden` attribute and each holding an empty <h2> for a script to
  fill in later. Screen readers hear nothing, axe passes it, and WAVE reports
  two "Empty heading" errors. Everything else on the page is compliant, so the
  only findings are the ones §7.4 is about.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact us – form-check fixture</title>
  <style>
    button { min-height: 44px; padding: 0.5rem 1rem; }
  </style>
</head>
<body>
  <main>
    <h1 id="contact-form-heading">Contact us</h1>

    <div class="error-summary" role="alert" tabindex="-1" id="error-summary" hidden>
      <h2></h2>
      <ul></ul>
    </div>

    <div class="confirmation" tabindex="-1" id="save-confirmation" hidden>
      <h2></h2>
    </div>

    <form method="post" action="/contact" novalidate class="form-grid"
          aria-labelledby="contact-form-heading">
      <label for="email">Email</label>
      <div class="field">
        <input type="email" id="email" name="email" autocomplete="email">
      </div>
      <div class="form-actions">
        <button type="submit">Send</button>
      </div>
    </form>
  </main>
</body>
</html>
